!
hostname c8200-scaleway
!
clns routing
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 172.16.2.100 255.255.255.255
 ip router isis 1
 ipv6 address 2001:db8::2:100/128
 ipv6 enable
 ipv6 router isis 1
!
interface GigabitEthernet0/0/1
 ip address 10.100.2.10 255.255.255.254
 ip router isis 1
 ipv6 address fc00::2:10/127
 ipv6 enable
 ipv6 router isis 1
 no shutdown
!
router isis 1 
 net 49.0001.2876.00
 is-type level-2-only
!