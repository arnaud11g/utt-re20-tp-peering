!
hostname c8200-freesas
!
clns routing
!
ipv6 unicast-routing
!
interface Loopback0
 ip address 172.16.3.100 255.255.255.255
 ip router isis 1
 ipv6 address 2001:db8::3:100/128
 ipv6 enable
 ipv6 router isis 1
!
interface GigabitEthernet0/0/1
 ip address 10.100.3.10 255.255.255.254
 ip router isis 1
 ipv6 address fc00::3:10/127
 ipv6 enable
 ipv6 router isis 1
 no shutdown
!
router isis 1 
 net 49.0001.2322.00
 is-type level-2-only
!